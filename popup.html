<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="logo"></div>
    <h1>AudiStop</h1>
    <label class="switch" data-i18n-title="toggleTitle">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <p class="subtitle" data-i18n="subtitle"></p>

  <section class="modes">
    <label class="radio">
      <input type="radio" name="mode" value="all">
      <span><strong data-i18n="modeAllTitle"></strong><br><small data-i18n="modeAllDesc"></small></span>
    </label>
    <label class="radio">
      <input type="radio" name="mode" value="sites">
      <span><strong data-i18n="modeSitesTitle"></strong><br><small data-i18n="modeSitesDesc"></small></span>
    </label>
  </section>

  <section id="sitesPanel" class="sites">
    <div class="siteAddRow">
      <button id="addCurrent" type="button" data-i18n="addThisTab"></button>
    </div>
    <ul id="siteList"></ul>
    <p id="sitesEmpty" class="hint" data-i18n="sitesEmptyHint"></p>
  </section>

  <footer id="status"></footer>

  <script src="popup.js"></script>
</body>
</html>
